    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do you calculate rental yield?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Gross rental yield is the annual rent (weekly rent times 52) divided by the property price, as a percentage. Net rental yield subtracts annual costs such as council rates, insurance, strata, management fees, maintenance and vacancy, then divides by the price plus buying costs."
            }
          },
          {
            "@type": "Question",
            "name": "What is a good rental yield in Australia?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Capital-city houses commonly return around 2.5 to 4 percent gross, units a little more, and regional or lower-priced properties can exceed 5 percent. Higher yield usually comes with lower expected capital growth."
            }
          },
          {
            "@type": "Question",
            "name": "Does rental yield include the mortgage?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Yield measures the income return of the property itself, independent of financing. Your cash flow does depend on the loan, so this calculator shows loan interest and pre-tax cash flow separately from the yield figures."
            }
          },
          {
            "@type": "Question",
            "name": "What is negative gearing?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A property is negatively geared when its total costs, including loan interest, are more than the rent it earns. In Australia that annual loss can generally be deducted against your other taxable income, reducing the after-tax cost of holding the property."
            }
          }
        ]
      }
    </script>
